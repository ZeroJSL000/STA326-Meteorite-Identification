[project]
name = "sta326-meteorite-final"
version = "1.0.0"
description = "Reproducible SwinV2 five-fold meteorite classifier without guarded fusion"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "albumentations>=2.0.8",
    "numpy>=2.0",
    "pandas>=2.2",
    "pillow>=10.0",
    "timm>=1.0.27",
    "torch>=2.5",
    "tqdm>=4.67",
]

[project.scripts]
meteorite-final = "meteorite_final.cli:main"

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.11"]
