experiment_name: "convnextv2_phase1_smoke"
paths:
  dataset_dir: "preData/cascade_dataset"
  original_image_dir: "data/train_images"
  sample_submission_csv: "data/sample_submission.csv"
model:
  backbone: "convnextv2_base.fcmae_ft_in22k_in1k"
  pretrained_file: "convnextv2_base.fcmae_ft_in22k_in1k.pth"
  image_size: 128
  pooling: "gap"
  patch_size: 32
train:
  folds: 5
  fold_limit: 1
  epochs: 2
  batch_size: 16
  valid_batch_size: 32
  base_lr: 0.0001
  backbone_lr_factor: 0.01
  weight_decay: 0.05
  pos_weight_mode: "dynamic"
  loss_type: "focal"
  focal_gamma: 2.0
  focal_alpha: 0.25
  label_smoothing: 0.1
  use_logit_adjustment: false
  train_pos_prior: 0.5
  hard_mining_enabled: false
  hard_mining_topk: 0.1
  hard_mining_boost: 3.0
data:
  num_workers: 2
ema:
  enabled: false
  decay: 0.999
augmentation:
  coarse_dropout:
    enabled: true
    max_holes: 8
    max_height: 64
    max_width: 64
  randaugment:
    enabled: true
    num_ops: 2
    magnitude: 10
  mixup_enabled: true
  mixup_prob: 0.5
  mixup_alpha: 0.4
  cutmix_enabled: true
  cutmix_prob: 0.5
  cutmix_alpha: 1.0
  multiscale_train_enabled: true
  multiscale_train_sizes: [96, 128]
preprocessing:
  soft_masking:
    enabled: true
    mask_alpha: 0.7
test:
  tta_enabled: true
  tta_scales: [96, 128]
  tta_flips: ["none", "horizontal"]
inference:
  batch_size: 32
