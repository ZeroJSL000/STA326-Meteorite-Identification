experiment_name: "convnextv2_phase3_pseudo"
paths:
  dataset_dir: "preData/cascade_dataset"
  original_image_dir: "data/train_images"
  sample_submission_csv: "data/sample_submission.csv"
model:
  backbone: "convnextv2_base.fcmae_ft_in22k_in1k"
  pretrained_file: "convnextv2_base.fcmae_ft_in22k_in1k.pth"
  image_size: 384
  pooling: "gap"
  patch_size: 32
train:
  folds: 5
  epochs: 20
  batch_size: 16
  base_lr: 0.0001
  backbone_lr_factor: 0.1
  weight_decay: 0.05
  pos_weight_mode: "dynamic"
  loss_type: "bce"
  focal_gamma: 2.0
  focal_alpha: 0.25
  use_logit_adjustment: false
  train_pos_prior: 0.5
  hard_mining_enabled: false
  hard_mining_topk: 0.1
  hard_mining_boost: 3.0
ema:
  enabled: true
  decay: 0.999
augmentation:
  coarse_dropout:
    enabled: true
    max_holes: 8
    max_height: 64
    max_width: 64
  randaugment:
    enabled: false
    num_ops: 9
    magnitude: 10
  mixup_enabled: false
  mixup_prob: 0.5
  mixup_alpha: 0.4
  cutmix_enabled: false
  cutmix_prob: 0.5
  cutmix_alpha: 1.0
  multiscale_train_enabled: false
  multiscale_train_sizes: [320, 352, 384, 416, 448]
preprocessing:
  soft_masking:
    enabled: false
    mask_alpha: 0.7
test:
  tta_enabled: false
  tta_scales: [384, 448, 512]
  tta_flips: ["none", "horizontal"]
pseudo_labeling:
  enabled: true
  high_confidence_threshold: 0.995
  low_confidence_threshold: 0.01
  co_teaching_enabled: true
  co_teaching_agreement_threshold: 0.95
  co_teaching_model_dirs:
    - "outputs/convnextv2_masked_baseline"
    - "outputs/cswin_masked_baseline"
  pseudo_sample_weight: 0.5
  pseudo_lr_factor: 0.33
  pseudo_epoch_factor: 0.5
  init_checkpoint_dir: "weights/checkpoints/convnextv2_masked_baseline"
calibration:
  temperature_scaling: true
  temperature_min: 0.1
  temperature_max: 5.0
  prior_pos_rate: 0.438
  use_bayesian_correction: true
  train_pos_prior: 0.5
  threshold_iterations: 64
  probability_epsilon: 0.000001
  threshold_tie_breaker: 0.5
